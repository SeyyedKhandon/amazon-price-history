<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Price History</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --accent: #d17a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --fg: #f2f2f2;
      --muted: #a0a0a0;
      --border: #3a3a3a;
      --accent: #f0a94b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 260px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  #app { padding: 14px; }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 12px;
    line-height: 1.3;
    max-height: 2.6em;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    padding: 16px 0;
    text-align: center;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  a.btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
  }
  a.btn:hover { border-color: var(--accent); color: var(--accent); }
  a.btn img { width: 16px; height: 16px; border-radius: 3px; }
  #contact {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 0;
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
  }
  #contact:hover { color: var(--accent); }
  #options {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  #options label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="app">
    <h1 id="title">Price History</h1>
    <div id="status">Loading…</div>
    <div class="actions" id="actions" hidden></div>
    <div id="options">
      <label>
        <input type="checkbox" id="enable-embedded-btns" checked>
        Show buttons on Amazon pages
      </label>
    </div>
    <button id="contact" type="button" data-email="support.mhdi@gmail.com">Contact developer</button>
  </div>
  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
