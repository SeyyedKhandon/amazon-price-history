<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Toolbox for Amazon</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #e5e5e5;
        --accent: #d17a00;
        --track: #c9cdcd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #a0a0a0;
          --border: #3a3a3a;
          --accent: #f0a94b;
          --track: #555;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #app {
        padding: 14px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 12px;
        line-height: 1.3;
        max-height: 2.6em;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #status {
        font-size: 13px;
        color: var(--muted);
        padding: 16px 0;
        text-align: center;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      a.btn {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
      }
      a.btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      a.btn img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      #contact {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 0;
        font: inherit;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        text-decoration: none;
        background: none;
        border: none;
        cursor: pointer;
      }
      #contact:hover {
        color: var(--accent);
      }
      #options {
        margin-top: 10px;
        border-top: 1px solid var(--border);
      }
      .opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 11px 0;
        cursor: pointer;
        user-select: none;
      }
      .opt + .opt {
        border-top: 1px solid var(--border);
      }
      .opt .txt {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .opt b {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
      }
      .opt small {
        font-size: 11px;
        line-height: 1.35;
        color: var(--muted);
      }
      .opt input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .opt .sw {
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: var(--track);
        transition: background 0.15s;
      }
      .opt .sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: transform 0.15s;
      }
      .opt input:checked + .sw {
        background: var(--accent);
      }
      .opt input:checked + .sw::after {
        transform: translateX(16px);
      }
      .opt input:focus-visible + .sw {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1 id="title">Toolbox for Amazon</h1>
      <div id="status">Loading…</div>
      <div class="actions" id="actions" hidden></div>
      <div id="options">
        <label class="opt">
          <span class="txt">
            <b>Price-history buttons</b>
            <small>CamelCamelCamel and Keepa links on product pages</small>
          </span>
          <input type="checkbox" id="enable-embedded-btns" checked />
          <span class="sw"></span>
        </label>
        <label class="opt">
          <span class="txt">
            <b>Multi-page search toolbar</b>
            <small>Load several result pages, then filter and sort them</small>
          </span>
          <input type="checkbox" id="enable-search-toolbar" checked />
          <span class="sw"></span>
        </label>
      </div>
      <button id="contact" type="button" data-email="support.mhdi@gmail.com">
        Contact developer
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
